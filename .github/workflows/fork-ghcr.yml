# Fork-owned: builds the images this fork's self-hosted deployment runs and
# pushes them to ghcr.io/<owner>/. Upstream's deploy-*.yml workflows publish
# to ghcr.io/firecrawl and are disabled on the fork.
#
# Tags: the branch name (develop), which moves to every new build, and
# sha-<short>, which always names one build (use it to pin or roll back).
name: Fork Build Images to GHCR

on:
  push:
    branches:
      - develop
    paths:
      - apps/api/**
      - apps/playwright-service-ts/**
      - apps/nuq-postgres/**
      - .github/workflows/fork-ghcr.yml
  workflow_dispatch:

concurrency:
  group: fork-ghcr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: firecrawl
            context: ./apps/api
          - image: playwright-service
            context: ./apps/playwright-service-ts
          - image: nuq-postgres
            context: ./apps/nuq-postgres
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image name
        id: base
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.base.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
