# Fork-owned: builds the images this fork's self-hosted deployment runs and
# pushes them to ghcr.io/<owner>/. Upstream's deploy-*.yml workflows publish
# to ghcr.io/firecrawl and are disabled on the fork.
#
# Tags: the branch name (develop), sha-<short>, and on develop also the
# upstream release the branch is based on (e.g. v2.11.534).
name: Fork Build Images to GHCR

on:
  push:
    branches:
      - develop
    paths:
      - apps/api/**
      - apps/playwright-service-ts/**
      - apps/nuq-postgres/**
      - .github/workflows/fork-ghcr.yml
  workflow_dispatch:

concurrency:
  group: fork-ghcr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: firecrawl
            context: ./apps/api
          - image: playwright-service
            context: ./apps/playwright-service-ts
          - image: nuq-postgres
            context: ./apps/nuq-postgres
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve image name and upstream release
        id: base
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          # The fork doesn't carry upstream's release tags; fetch them to find
          # the release develop was last synced to.
          git fetch --no-tags https://github.com/firecrawl/firecrawl.git 'refs/tags/v*:refs/tags/v*'
          echo "release=$(git describe --tags --abbrev=0 --match 'v*' HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.base.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=${{ steps.base.outputs.release }},enable=${{ github.ref == 'refs/heads/develop' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
